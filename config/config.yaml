seed: 42
paths:
  raw: data/raw
  collection: data/collection.jsonl
  topics: data/topics.csv
  qrels: data/qrels.txt
  gold: data/gold_answers.csv
  runs: runs
  results: results
chunking:
  strategy: section        # section | fixed | recursive
  max_tokens: 400
  overlap_tokens: 50
  min_section_words: 35    # deterministic merge threshold for short sub-sections
retrieval:
  bm25:
    k1: 1.2
    b: 0.75
  dense:
    model: BAAI/bge-small-en-v1.5
    normalize: true
  top_k: [1, 3, 5]
  score_threshold: null    # set in Phase 4
generation:
  provider: ollama
  model: llama3.2:latest
  temperature: 0.0
  num_predict: 512
  prompt_variant: settlein  # walert | settlein | closed_book
experiments:
  include_no_retrieval: true  # closed-book baseline arm (no retrieved passages)
  retrievers: [bm25, dense]
  top_k: [1, 3, 5]
  prompt_variants: [walert, settlein, closed_book]
evaluation:
  metrics: [ndcg@1, ndcg@3, ndcg@5, recall@5, hit_rate@5, mrr]
  alpha: 0.01

